# X11 fallback for the SunFounder TFT 3.5" panel.
#
# X11 (modesetting driver) flips the framebuffer without reporting damage, which
# leaves the SPI panel showing the first frame. The fbdev driver writes into
# /dev/fb0 instead, where the kernel framebuffer path refreshes the panel.
#
# Only usable on systems that run a pure X11 session and a single display: the
# fbdev driver cannot drive more than one output.
Section "Device"
    Identifier "SunFounder TFT panel"
    Driver     "fbdev"
    Option     "fbdev" "/dev/fb0"
EndSection
