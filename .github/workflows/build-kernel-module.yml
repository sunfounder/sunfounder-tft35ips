name: build-kernel-module

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      kernel:
        description: "Build one kernel only, e.g. 6.12.109+rpt-rpi-v8 (blank = the matrix)"
        required: false
        type: string

permissions:
  contents: write

env:
  # suites to read kernel headers from (newest release first)
  SUITES: "bookworm trixie"

jobs:
  discover:
    runs-on: ubuntu-latest
    container: debian:bookworm
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Find the current kernel header packages
        shell: bash
        run: |
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl python3 gzip
          mkdir -p /tmp/idx
          for suite in $SUITES; do
            for a in arm64 armhf; do
              curl -fsSL "http://archive.raspberrypi.com/debian/dists/$suite/main/binary-$a/Packages.gz" \
                | gunzip > "/tmp/idx/$a-$suite"
            done
          done
          wc -l /tmp/idx/*

      - name: Generate matrix
        id: gen
        shell: bash
        run: |
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          if [ -n "${{ inputs.kernel }}" ]; then
            K="${{ inputs.kernel }}"
            case "$K" in
              *2712*) V=2712 ;;
              *v8*)   V=v8 ;;
              *)      echo "unsupported kernel: $K" >&2; exit 1 ;;
            esac
            printf '[{"headers":"linux-headers-%s","kernel":"%s","variant":"%s"}]' "$K" "$K" "$V" > /tmp/matrix.json
            echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
            cat /tmp/matrix.json
            exit 0
          fi
          python3 - <<'PY' > /tmp/matrix.json
          import json, os, re

          found = set()
          for suite in os.environ.get("SUITES", "bookworm trixie").split():
              path = "/tmp/idx/arm64-" + suite
              if not os.path.exists(path):
                  continue
              with open(path) as f:
                  for line in f:
                      m = re.match(r"Package: linux-headers-(\d+\.\d+\.\d+\+rpt-rpi-(?:v8|2712))$",
                                   line.strip())
                      if m:
                          found.add(m.group(1))

          def key(v):
              m = re.match(r"(\d+)\.(\d+)\.(\d+)", v)
              return tuple(int(x) for x in m.groups()) if m else (0, 0, 0)

          by_variant = {}
          for ver in found:
              by_variant.setdefault(ver.rsplit("-", 1)[1], set()).add(ver)

          def series(v):
              m = re.match(r"(\d+\.\d+)\.", v)
              return m.group(1) if m else v

          include = []
          for variant, versions in by_variant.items():
              # newest two per kernel series (6.12.x, 6.18.x, ...)
              per_series = {}
              for ver in versions:
                  per_series.setdefault(series(ver), []).append(ver)
              for _, vers in per_series.items():
                  for ver in sorted(vers, key=key, reverse=True)[:2]:
                      include.append({
                          "headers": "linux-headers-" + ver,
                          "kernel": ver,
                          "variant": variant,
                      })

          print(json.dumps(include))
          PY
          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
          cat /tmp/matrix.json

  deb:
    runs-on: ubuntu-latest
    container: debian:bookworm
    needs: discover
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends device-tree-compiler dpkg-dev

      - name: Build the DKMS package
        run: bash packaging/build-deb.sh

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          fail_on_unmatched_files: true

  build:
    needs: discover
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl gnupg xz-utils device-tree-compiler build-essential

      - name: Fetch kernel headers
        shell: bash
        run: |
          BASE="$(echo "${{ matrix.kernel }}" | sed 's/+rpt.*//')"
          COMMON="linux-headers-${BASE}+rpt-common-rpi"
          KBUILD="linux-kbuild-${BASE}+rpt"
          mkdir -p /tmp/debs /tmp/hdr /usr/src
          cd /tmp/debs
          curl -fsSL "http://archive.raspberrypi.com/debian/raspberrypi.gpg.key" \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/raspberrypi.gpg
          for suite in $SUITES; do
            echo "deb http://archive.raspberrypi.com/debian $suite main"
          done | sudo tee /etc/apt/sources.list.d/raspberrypi.list
          sudo apt-get update
          sudo apt-get download "${{ matrix.headers }}:arm64"
          sudo apt-get download "${COMMON}" || true
          sudo apt-get download "${KBUILD}:arm64" || sudo apt-get download "${KBUILD}" || true
          sudo chown -R "$USER" /tmp/debs 2>/dev/null || true
          for d in *.deb; do dpkg -x "$d" /tmp/hdr; done
          test -d "/tmp/hdr/usr/src/linux-headers-${{ matrix.kernel }}"
          test -d "/tmp/hdr/usr/src/${COMMON}"
          test -d "/tmp/hdr/usr/lib/${KBUILD}/scripts"
          sudo mkdir -p /usr/src
          sudo ln -sfn "/tmp/hdr/usr/src/linux-headers-${{ matrix.kernel }}" "/usr/src/linux-headers-${{ matrix.kernel }}"
          sudo ln -sfn "/tmp/hdr/usr/src/${COMMON}" "/usr/src/${COMMON}"
          echo "headers ready"

      - name: Build module
        shell: bash
        run: |
          make -C /usr/src/linux-headers-${{ matrix.kernel }} \
            M="$PWD/driver" \
            ARCH=arm64 \
            modules
          cd driver
          dtc -@ -I dts -O dtb -o sunfounder-tft35ips.dtbo sunfounder-tft35ips-overlay.dts
          xz -9 sunfounder-tft35ips.ko
          echo "built sunfounder-tft35ips.ko.xz and sunfounder-tft35ips.dtbo"

      - name: Stage artifacts
        run: |
          mkdir -p out
          cp driver/sunfounder-tft35ips.ko.xz "out/sunfounder-tft35ips-${{ matrix.kernel }}-arm64.ko.xz"
          cp driver/sunfounder-tft35ips.dtbo "out/sunfounder-tft35ips-${{ matrix.kernel }}-arm64.dtbo"

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: true
