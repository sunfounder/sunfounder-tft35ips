name: build-kernel-module

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    container: debian:bookworm
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Find the current kernel header packages
        shell: bash
        run: |
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl python3 gzip
          mkdir -p /tmp/idx
          for a in arm64 armhf; do
            curl -fsSL "http://archive.raspberrypi.com/debian/dists/bookworm/main/binary-$a/Packages.gz" \
              | gunzip > "/tmp/idx/$a"
          done
          wc -l /tmp/idx/*

      - name: Generate matrix
        id: gen
        shell: bash
        run: |
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          python3 - <<'PY' > /tmp/matrix.json
          import json, re

          found = set()
          for path in ("/tmp/idx/arm64", "/tmp/idx/armhf"):
              with open(path) as f:
                  for line in f:
                      m = re.match(
                          r"Package: linux-headers-(\d+\.\d+\.\d+\+rpt-rpi-(?:v6|v7|v7l|v8|2712))$",
                          line.strip())
                      if m:
                          found.add(m.group(1))

          arch_for = {
              "v8": ("arm64", "aarch64-linux-gnu-", "arm64"),
              "2712": ("arm64", "aarch64-linux-gnu-", "arm64"),
              "v7l": ("arm", "arm-linux-gnueabihf-", "armhf"),
              "v7": ("arm", "arm-linux-gnueabihf-", "armhf"),
              "v6": ("arm", "arm-linux-gnueabihf-", "armhf"),
          }

          def key(v):
              m = re.match(r"(\d+)\.(\d+)\.(\d+)", v)
              return tuple(int(x) for x in m.groups()) if m else (0, 0, 0)

          by_variant = {}
          for ver in found:
              by_variant.setdefault(ver.rsplit("-", 1)[1], set()).add(ver)

          include = []
          for variant, versions in by_variant.items():
              if variant not in arch_for:
                  continue
              arch, cross, debarch = arch_for[variant]
              for ver in sorted(versions, key=key, reverse=True)[:3]:
                  include.append({
                      "headers": "linux-headers-" + ver,
                      "kernel": ver,
                      "arch": arch,
                      "cross": cross,
                      "debarch": debarch,
                  })

          print(json.dumps(include))
          PY
          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
          cat /tmp/matrix.json

  build:
    needs: discover
    runs-on: ubuntu-latest
    container: debian:bookworm
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl gnupg xz-utils device-tree-compiler \
            crossbuild-essential-arm64 crossbuild-essential-armhf

      - name: Add Raspberry Pi archive
        run: |
          curl -fsSL https://archive.raspberrypi.com/debian/raspberrypi.gpg.key \
            | gpg --dearmor -o /etc/apt/trusted.gpg.d/raspberrypi.gpg
          echo "deb http://archive.raspberrypi.com/debian bookworm main" \
            > /etc/apt/sources.list.d/raspberrypi.list
          dpkg --add-architecture ${{ matrix.debarch }}
          apt-get update

      - name: Fetch kernel headers
        shell: bash
        run: |
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          BASE="$(echo "${{ matrix.kernel }}" | sed 's/+rpt.*//')"
          COMMON="linux-headers-${BASE}+rpt-common-rpi"
          mkdir -p /tmp/debs /tmp/hdr /usr/src
          cd /tmp/debs
          apt-get download "${{ matrix.headers }}:${{ matrix.debarch }}"
          apt-get download "${COMMON}" || true
          apt-get download "linux-kbuild-${BASE}+rpt:${{ matrix.debarch }}" 2>/dev/null \
            || apt-get download "linux-kbuild-${BASE}+rpt" || true
          for d in *.deb; do dpkg -x "$d" /tmp/hdr; done
          test -d "/tmp/hdr/usr/src/linux-headers-${{ matrix.kernel }}"
          test -d "/tmp/hdr/usr/src/${COMMON}"
          test -d "/tmp/hdr/usr/lib/linux-kbuild-${BASE}+rpt/scripts"
          # the variant Makefile includes the common tree by absolute path
          ln -sfn "/tmp/hdr/usr/src/linux-headers-${{ matrix.kernel }}" "/usr/src/linux-headers-${{ matrix.kernel }}"
          ln -sfn "/tmp/hdr/usr/src/${COMMON}" "/usr/src/${COMMON}"
          echo "headers ready: /usr/src/linux-headers-${{ matrix.kernel }}"

      - name: Build module
        shell: bash
        run: |
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          make -C /usr/src/linux-headers-${{ matrix.kernel }} \
            M="$PWD/driver" \
            ARCH=${{ matrix.arch }} \
            CROSS_COMPILE=${{ matrix.cross }} \
            modules
          cd driver
          dtc -@ -I dts -O dtb -o sunfounder-tft35ips.dtbo sunfounder-tft35ips-overlay.dts
          xz -9 sunfounder-tft35ips.ko
          echo "built sunfounder-tft35ips.ko.xz and sunfounder-tft35ips.dtbo"

      - name: Stage artifacts
        run: |
          mkdir -p out
          cp driver/sunfounder-tft35ips.ko.xz "out/sunfounder-tft35ips-${{ matrix.kernel }}-${{ matrix.arch }}.ko.xz"
          cp driver/sunfounder-tft35ips.dtbo "out/sunfounder-tft35ips-${{ matrix.kernel }}-${{ matrix.arch }}.dtbo"

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: true
