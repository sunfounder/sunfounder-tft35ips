name: build-kernel-module

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    container: debian:bookworm
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Find the current kernel header packages
        shell: bash
        run: |
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg python3
          curl -fsSL https://archive.raspberrypi.com/debian/raspberrypi.gpg.key \
            | gpg --dearmor -o /etc/apt/trusted.gpg.d/raspberrypi.gpg
          echo "deb http://archive.raspberrypi.com/debian bookworm main" \
            > /etc/apt/sources.list.d/raspberrypi.list
          apt-get update

      - name: Generate matrix
        id: gen
        run: |
          python3 - <<'PY'
          import json, re, subprocess

          out = subprocess.run(
              ["apt-cache", "search", "--names-only", r"^linux-headers-.*-rpt-rpi-.*$"],
              capture_output=True, text=True).stdout

          pkgs = {}
          for line in out.splitlines():
              name = line.split()[0]
              m = re.match(r"linux-headers-(\d+\.\d+\.\d+\+rpt-rpi-(v6|v7|v7l|v8|2712))$", name)
              if m:
                  pkgs[name] = m.group(1)

          def sort_key(v):
              m = re.match(r"(\d+)\.(\d+)\.(\d+)", v)
              return tuple(int(x) for x in m.groups()) if m else (0, 0, 0)

          # newest two versions per variant
          by_variant = {}
          for name, ver in pkgs.items():
              variant = ver.rsplit("-", 1)[1]
              by_variant.setdefault(variant, set()).add(name)

          arch_for = {"v8": ("arm64", "aarch64-linux-gnu-", "arm64"),
                      "v7l": ("arm", "arm-linux-gnueabihf-", "armhf"),
                      "v7": ("arm", "arm-linux-gnueabihf-", "armhf"),
                      "v6": ("arm", "arm-linux-gnueabihf-", "armhf"),
                      "2712": ("arm64", "aarch64-linux-gnu-", "arm64")}

          include = []
          for variant, names in by_variant.items():
              if variant not in arch_for:
                  continue
              arch, cross, debarch = arch_for[variant]
              for name in sorted(names, key=lambda n: sort_key(pkgs[n]), reverse=True)[:2]:
                  include.append({
                      "headers": name,
                      "kernel": pkgs[name],
                      "arch": arch,
                      "cross": cross,
                      "debarch": debarch,
                  })

          print(json.dumps(include))
          with open("/tmp/matrix.json", "w") as f:
              json.dump(include, f)
          PY
          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    container: debian:bookworm
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl gnupg xz-utils device-tree-compiler \
            crossbuild-essential-arm64 crossbuild-essential-armhf

      - name: Add Raspberry Pi archive
        run: |
          curl -fsSL https://archive.raspberrypi.com/debian/raspberrypi.gpg.key \
            | gpg --dearmor -o /etc/apt/trusted.gpg.d/raspberrypi.gpg
          echo "deb http://archive.raspberrypi.com/debian bookworm main" \
            > /etc/apt/sources.list.d/raspberrypi.list
          dpkg --add-architecture ${{ matrix.debarch }}
          apt-get update

      - name: Fetch kernel headers
        shell: bash
        run: |
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          mkdir -p /tmp/debs
          cd /tmp/debs
          apt-get download "${{ matrix.headers }}:${{ matrix.debarch }}"
          apt-get download "linux-headers-${{ matrix.kernel }}+rpt-common-rpi:${{ matrix.debarch }}" || true
          for d in *.deb; do dpkg -x "$d" /; done
          test -d "/usr/src/linux-headers-${{ matrix.kernel }}"
          echo "headers ready: /usr/src/linux-headers-${{ matrix.kernel }}"

      - name: Build module
        shell: bash
        run: |
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          make -C /usr/src/linux-headers-${{ matrix.kernel }} \
            M="$PWD/driver" \
            ARCH=${{ matrix.arch }} \
            CROSS_COMPILE=${{ matrix.cross }} \
            modules
          cd driver
          dtc -@ -I dts -O dtb -o sunfounder-tft35ips.dtbo sunfounder-tft35ips-overlay.dts
          xz -9 sunfounder-tft35ips.ko
          ls -l sunfounder-tft35ips.ko.xz sunfounder-tft35ips.dtbo

      - name: Stage artifacts
        run: |
          mkdir -p out
          cp driver/sunfounder-tft35ips.ko.xz "out/sunfounder-tft35ips-${{ matrix.kernel }}-${{ matrix.arch }}.ko.xz"
          cp driver/sunfounder-tft35ips.dtbo "out/sunfounder-tft35ips-${{ matrix.kernel }}-${{ matrix.arch }}.dtbo"

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: true
